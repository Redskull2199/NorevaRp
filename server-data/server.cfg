# =========================================================
# NETWORK
# =========================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 7

sets tags "roleplay, qbcore, pulsev, rp"


# =========================================================
# SERVER INFO
# =========================================================

sv_hostname "NorevaRp"
sets sv_projectName "NorevaRP"
sets sv_projectDesc "NorvaRoleplay"

sets locale "tr-TR"

load_server_icon myLogo.png

# FiveM License Key
sv_licenseKey "REPLACE_WITH_FIVEM_LICENSE_KEY"

# Steam Web API
set steam_webApiKey "REPLACE_WITH_STEAM_WEB_API_KEY"

# Game Build
sv_enforceGameBuild 3258

set resources_useSystemChat true


# =========================================================
# DATABASE
# =========================================================

set mysql_connection_string "mysql://DB_USER:DB_PASSWORD@127.0.0.1:3307/pulsev?charset=utf8mb4"


# =========================================================
# ONESYNC
# =========================================================

## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on
set onesync_enableInfinity 1
set onesync_enableBeyond 1
set onesync_population true


# =========================================================
# PMA VOICE
# =========================================================

setr voice_useNativeAudio true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1
setr voice_useSendingRangeOnly false


# =========================================================
# QBCORE
# =========================================================

setr qb_locale "tr"

# qb-target yerine ox_target kullanıyorsan false kalsın
setr UseTarget false


# =========================================================
# OX TARGET
# =========================================================

# Tuşa basınca aç/kapat
setr ox_target:toggleHotkey 0

# Target tuşu
setr ox_target:defaultHotkey LMENU

# Target merkez sprite
setr ox_target:drawSprite 1

# Built-in target seçenekleri
setr ox_target:defaults 1


# =========================================================
# DEFAULT FIVEM RESOURCES
# =========================================================

ensure mapmanager
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap

# =========================================================
# STANDALONE / CORE DEPENDENCIES
# =========================================================

ensure [standalone]
ensure ox_lib
ensure qb-core

# =========================================================
# OX
# =========================================================

# Select the existing QBCore inventory bridge before starting ox_inventory.
setr inventory:framework "qb"
ensure ox_target
# start skips ox_lib / ox_target that are already running.
start [ox]

# =========================================================
# VOICE / QBCORE
# =========================================================

ensure [voice]
# qb-core is already running; do not restart it through a category ensure.
start [qb]
stop qb-phone

# =========================================================
# FIVEBAZAAR
# =========================================================
ensure cr-multicharacter
ensure [Meslekler]

# Renewed-Dutyblips imports Renewed-Lib without declaring a dependency.
# bl_bridge defaults to ox_core; select the installed QBCore bridge.
setr bl:framework "qb"
ensure Renewed-Lib
start [fivebazaar]
stop Afterlife_inventoryradial

# =========================================================
# YSO / AUDIO / HUD
# =========================================================

# xsound already starts through [standalone].
# 0r-chatv3 provides chat; do not also start the default chat.
ensure 0r-chatv3
ensure qb-radialmenu
ensure izzy-hudv6
# Other [yso] resources have unresolved external imports or framework dependencies.

# =========================================================
# MAPS / STREAM
# =========================================================

ensure [defaultmaps]
# [stream] has no FXServer-discoverable resource at its category level.

# =========================================================
# VEHICLES
# =========================================================

ensure [car]

# =========================================================
# PERMISSIONS
# =========================================================

# FiveM admin grubu
add_ace group.admin command allow
add_principal identifier.steam:REPLACE_WITH_PLAYER_IDENTIFIER qbcore.god   #Red Skull


# Senin txAdmin'in oluşturduğu yetki
add_principal identifier.fivem:REPLACE_WITH_PLAYER_IDENTIFIER group.admin

# İstersen Discord identifier da kullanılabilir
add_principal identifier.discord:REPLACE_WITH_PLAYER_IDENTIFIER group.admin


# =========================================================
# QBCORE PERMISSIONS
# =========================================================

# qb-core komut çalıştırabilsin
add_ace resource.qb-core command allow

# GOD
add_ace qbcore.god command allow

# Permission inheritance
add_principal qbcore.god group.admin
add_principal qbcore.god qbcore.admin

add_principal qbcore.admin qbcore.mod
# Blip Creator: permission limited to the approved license
add_ace identifier.license:REPLACE_WITH_PLAYER_IDENTIFIER pulsev.blipcreator allow

# NorevaRP character selection; dependency compatibility patches require full restart.
ensure noreva-multicharacter
