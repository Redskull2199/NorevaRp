<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css" type="text/css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
</head>
<body>
  <div class="screen-shell">
    <div class="vehicletvcreator-container" id="vehicletvcreatorshow">
      <div class="creator-card">
        <div class="creator-head">
          <div class="creator-title-wrap">
            <div class="creator-title">Television Creator</div>
          </div>
        </div>

        <div class="creator-list">
          <div class="creator-row"><span class="creator-key">Arrows</span><span class="creator-text">Move</span></div>
          <div class="creator-row"><span class="creator-key">Z</span><span class="creator-text">Move Up</span></div>
          <div class="creator-row"><span class="creator-key">Y</span><span class="creator-text">Move Down</span></div>
          <div class="creator-row"><span class="creator-key">G</span><span class="creator-text">Change Speed</span></div>
          <div class="creator-row"><span class="creator-key">H</span><span class="creator-text">Change Mode</span></div>
          <div class="creator-row stat-row"><span class="creator-text">Current Speed</span><span class="creator-value" id="currentspeeddata">1</span></div>
          <div class="creator-row stat-row"><span class="creator-text">Current Mode</span><span class="creator-value" id="currentmodedata">MOVE</span></div>
          <div class="creator-row finish-row"><span class="creator-key">Enter</span><span class="creator-text">Finish</span></div>
        </div>
      </div>
    </div>

<div class="vehicletvcreatorfinish-container" id="vehicletvcreatorfinishshow">
  <div class="finish-card finish-card-compact">
    <div class="finish-head">
      <div class="finish-head-main">
        <div class="creator-title">Television Creator</div>
        <div class="finish-head-sub">Offsets Preview</div>
      </div>

      <button class="finish-close closetvcreatorfinish" type="button" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="finish-body">
      <div class="offset-preview-box">
        <textarea class="tvcopytextdata" placeholder="" type="text" spellcheck="false"></textarea>
      </div>

      <div class="finish-actions">
        <button class="buttoncopy" type="button">
          <i class="fa-solid fa-copy" id="copyicon"></i>
          <span>Copy Offsets</span>
        </button>
      </div>
    </div>
  </div>
</div>

    <div class="tv-container" id="tvshow">
      <div class="tv-card">
        <div class="tv-header">
          <div class="tv-title-wrap">
            <div class="tv-title"><i class="fas fa-tv"></i><span>Television</span></div>
          </div>
          <button class="close-btn" id="close-btn" type="button" aria-label="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="tv-content">
          <div class="status-card">
            <div class="status-top">
              <div class="section-title currently-title" id="currently-playing">Currently Playing</div>
            </div>
            <div class="now-playing-type" id="currentlytexttype">Idle</div>
            <div class="now-playing-url" id="currentlytextdatashow">
              <div class="now-playing-url-text" id="currentlytextdata2"></div>
            </div>
          </div>

          <div class="control-card source-card">
            <div class="section-title">Source</div>
            <input class="video-input" id="videoinputtvdata" placeholder="Enter video URL or local media name" type="text">
          </div>

          <div class="control-card">
            <div class="section-title">Volume</div>
            <div class="slider-row">
              <i class="fas fa-volume-low slider-icon"></i>
              <input type="range" min="0" max="100" value="50" class="volume-slider" id="volumesliderdata" onchange="volumechange(this)">
              <i class="fas fa-volume-high slider-icon"></i>
            </div>
          </div>

          <div class="control-card">
            <div class="section-title">Playback</div>
            <div class="time-labels">
              <span id="currenttimedata">00:00</span>
              <span id="maxtimedata">00:00</span>
            </div>
            <div class="slider-row">
              <i class="fas fa-backward-step slider-icon"></i>
              <input type="range" min="0" max="100" value="0" class="time-slider" id="timesliderdata">
              <i class="fas fa-forward-step slider-icon"></i>
            </div>
          </div>

          <div class="action-buttons">
            <button class="action-btn primary-btn" id="play-btn" type="button">
              <i class="fas fa-play"></i>
              <span>Play</span>
            </button>

            <button class="action-btn secondary-btn" id="pause-resume-btn" type="button">
              <i class="fas fa-pause" id="pause-resume-icon"></i>
              <span id="pause-resume-text">Pause</span>
            </button>

            <button class="action-btn secondary-btn" id="open-library-btn" type="button">
              <i class="fas fa-folder-open"></i>
              <span>Local Media</span>
            </button>

            <button class="action-btn secondary-btn power-btn" id="power-btn" type="button">
              <i class="fas fa-power-off"></i>
              <span>Turn Off</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="media-modal" id="media-modal" style="display: none;">
    <div class="media-modal-card">
      <div class="media-modal-header">
        <div class="media-modal-title"><i class="fas fa-folder-open"></i><span>Local Media</span></div>
        <button class="media-modal-close" id="close-library-btn" type="button" aria-label="Close">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="media-modal-search">
        <input class="media-search-input" id="media-search-input" type="text" placeholder="Search local media">
        <button class="media-refresh-btn" id="refresh-library-btn" type="button" aria-label="Refresh">
          <i class="fas fa-rotate-right"></i>
        </button>
      </div>

      <div class="media-modal-list" id="media-library-list"></div>
    </div>
  </div>

  <script src="scripts.js" type="text/javascript"></script>
</body>
</html>
