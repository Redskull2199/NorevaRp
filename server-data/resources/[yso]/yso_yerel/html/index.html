<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yerel Cekici</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tow-menu" class="tow-menu hidden">
        <div class="tow-header">
            <div class="scene">
                <div class="sky-gradient"></div>
                <div class="road-surface">
                    <div class="road-lines"></div>
                </div>

                <div class="truck-wrap">
                    <svg class="truck-svg-clean" viewBox="0 0 140 60" xmlns="http://www.w3.org/2000/svg">
                        <rect x="8" y="38" width="85" height="18" rx="3" fill="#d1d5db" stroke="#9ca3af" stroke-width="0.8"/>
                        <path d="M90 22 L118 22 L122 28 L122 56 L90 56 Z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="0.8"/>
                        <path d="M93 26 L112 26 L115 30 L115 38 L93 38 Z" fill="#93c5fd" opacity="0.5"/>
                        <line x1="50" y1="38" x2="50" y2="16" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
                        <line x1="50" y1="16" x2="72" y2="10" stroke="#6b7280" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="72" y1="10" x2="72" y2="30" stroke="#4b5563" stroke-width="1.2"/>
                        <path d="M70 30 Q72 34 74 30" stroke="#374151" stroke-width="1.5" fill="none"/>
                        <g class="truck-wheel">
                            <circle cx="28" cy="58" r="7" fill="#374151"/>
                            <circle cx="28" cy="58" r="3.5" fill="#9ca3af"/>
                            <circle cx="28" cy="58" r="1.2" fill="#e5e7eb"/>
                        </g>
                        <g class="truck-wheel">
                            <circle cx="105" cy="58" r="7" fill="#374151"/>
                            <circle cx="105" cy="58" r="3.5" fill="#9ca3af"/>
                            <circle cx="105" cy="58" r="1.2" fill="#e5e7eb"/>
                        </g>
                        <circle cx="120" cy="32" r="2.5" fill="#fca5a5" opacity="0.7"/>
                        <circle cx="120" cy="42" r="2.5" fill="#93c5fd" opacity="0.7"/>
                        <rect x="5" y="42" width="4" height="8" rx="1" fill="#fef3c7"/>
                    </svg>
                </div>

                <div class="dust-cloud">
                    <span class="d-particle"></span>
                    <span class="d-particle"></span>
                    <span class="d-particle"></span>
                    <span class="d-particle"></span>
                    <span class="d-particle"></span>
                    <span class="d-particle"></span>
                </div>
            </div>

            <h2>YEREL ÇEKİCİ</h2>
        </div>

        <div class="tow-content">
            <div class="timer-block">
                <div class="timer-top">KALAN SÜRE</div>
                <div class="timer-middle">
                    <span id="countdown-timer" class="timer-num">15</span>
                    <span class="timer-suffix">saniye</span>
                </div>
            </div>

            <div class="status-row">
                <div id="status-indicator" class="status-dot"></div>
                <span id="tow-status-text">Yola çıktı...</span>
            </div>

            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
