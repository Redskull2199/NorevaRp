<html>
	<head>
		<link rel="stylesheet" href="reset.css" type="text/css">
        <link rel="stylesheet" href="index.css" type="text/css">
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
	</head>
	<body>
		<div id="container">
			<div id="case-open-wrapper">
				<!-- Kasa Açma Başlığı -->
				<div id="case-header">
					<div id="header-glow"></div>
					<span id="case-title">KASA AÇILIYOR</span>
					<div id="header-line"></div>
				</div>

				<!-- Spinner Alanı -->
				<div class="roller-wrap">
					<div class="edge-fade left"></div>
					<div class="edge-fade right"></div>
					<div class="center-marker">
						<div class="marker-triangle top"></div>
						<div class="marker-line"></div>
						<div class="marker-triangle bottom"></div>
					</div>
					<div class="raffle-roller-holder">
						<div class="raffle-roller-container" style="margin-left: 0px;"></div>
					</div>
				</div>

				<!-- Alt Bilgi -->
				<div id="case-footer">
					<span id="footer-hint">Açmak için kasayı kullanın</span>
				</div>
			</div>
		</div>

		<!-- Ses Efektleri (Web Audio API ile üretiliyor - dosya gerekmez) -->
        <script src="./index.js" type="text/javascript"></script>
	</body>
</html>
