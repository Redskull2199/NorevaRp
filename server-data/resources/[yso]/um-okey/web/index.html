<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>

  <div class="start-menu-overlay">
    <div class="start-menu">
      <h2 class="start-menu-title"></h2>
      <p class="start-menu-description"></p>
      <button id="start-game" class="start-game-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span class="start-game-spn"></span>
      </button>
    </div>
  </div>

  <div class="center-table">
    <button id="give-center">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-dices-icon lucide-dices">
        <rect width="12" height="12" x="2" y="10" rx="2" ry="2" />
        <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" />
        <path d="M6 18h.01" />
        <path d="M10 14h.01" />
        <path d="M15 6h.01" />
        <path d="M18 9h.01" />
      </svg>
      <span></span>
    </button>
  </div>

  <div class="give-throw">
    <button id="give">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-reply-icon lucide-reply">
        <path d="M20 18v-2a4 4 0 0 0-4-4H4" />
        <path d="m9 17-5-5 5-5" />
      </svg>
      <span></span>
    </button>
    <button id="throw" class="throw-force-right">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-forward-icon lucide-forward">
        <path d="m15 17 5-5-5-5" />
        <path d="M4 18v-2a4 4 0 0 1 4-4h12" />
      </svg>
      <span></span>
    </button>
  </div>


  <div class="finish-container">
    <button id="finish-hand">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-iteration-cw-icon lucide-iteration-cw">
        <path d="M4 10a8 8 0 1 1 8 8H4" />
        <path d="m8 22-4-4 4-4" />
      </svg>
      <span></span>
    </button>
  </div>

  <div class="outer-container">
    <div class="fixed-ratio-container">
      <div class="istaka">
      </div>
    </div>
  </div>

  <script defer type="module" src="js/app.js"></script>
</body>

</html>
